<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexventure</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main>
    <!-- Inicio -->
    <section id="start-screen">
      <h1>Lexventure</h1>
      <p>Aprende inglés jugando con cartas</p>
      <button id="button-start">JUGAR</button>
    </section>

    <!-- Categorías -->
    <section id="category-screen" class="hidden">
      <h2>Selecciona una categoría</h2>
      <!--AQUI IRA EL CONTENIDO DE LAS CATEGORIAS-->
    </section>
    
    <!-- Tablero -->
    <section id="game-board" class="hidden">
      <div class="card-container">
        <div class="card">
          <div class="front">
            <h3>Card One</h3>
            <!-- <a href="#">Rotate</a> -->
          </div>
          <div class="back">
            <h3>BACK 1</h3>
          </div>
        </div>
      </div>

      <div class="card-container">
        <div class="card">
          <div class="front">
            <h3>Card Two</h3>
            <!-- <a href="#">Rotate</a> -->
          </div>
          <div class="back">
            <h3>BACK 2</h3>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>

</html>
